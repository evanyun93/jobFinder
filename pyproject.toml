[project]
name = "jobfinder"
version = "0.1.0"
description = "서울·판교 생활권 채용공고 텔레그램 알리미"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.1,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 상주 모드(python -m app.main run)용. Vercel 은 Cron 이 대신하므로 불필요.
local = ["APScheduler>=3.10"]
# Vercel 밖에서 server.py 를 띄울 때(Docker, VM 등). PORTING.md 참고.
server = ["gunicorn>=21.0"]

# 이 저장소는 설치형 패키지가 아니라 그냥 앱이다. 이걸 빼면 uv 가 빌드를
# 시도하다가 실패한다.
[tool.uv]
package = false

# Vercel 의 Python 빌더는 `api/*.py` 를 함수 하나씩 만드는 예전 방식 대신
# 앱 하나를 요구한다. server.py 의 WSGI 앱이 /api/cron 과 /api/telegram 을
# 직접 라우팅한다.
[tool.vercel]
entrypoint = "server:app"
